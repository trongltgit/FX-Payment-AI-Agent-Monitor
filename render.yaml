# Render Blueprint – gói free/starter chỉ phù hợp DEMO (đĩa tạm thời). Production: dùng đĩa bền + Redis managed.
services:
  - type: web
    name: fx-payment-agent-monitor
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -w 1 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PRICING_ENVIRONMENT
        value: demo
      - key: SECRET_KEY
        generateValue: true
      - key: API_SIGNING_SECRET
        generateValue: true
      - key: CARD_VAULT_KEY
        generateValue: true
      - key: ALLOW_MEMORY_STORE
        value: "1"
      - key: TRUSTED_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DEMO_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: mock
