# docker compose up --build      (cần file .env – xem .env.example)
services:
  web:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports: ["5000:5000"]
    depends_on: [redis]
    volumes:
      - agentmon_data:/app/data
      - agentmon_logs:/app/logs
      - agentmon_models:/app/models
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
volumes:
  agentmon_data:
  agentmon_logs:
  agentmon_models:
